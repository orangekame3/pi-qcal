# Example pi-qcal configuration.
# Copy to one of:
# - .pi/qcal.toml in a trusted project
# - qcal.toml in the project root
# - ~/.config/pi-qcal/config.toml
# Or point PI_QCAL_CONFIG at this file.

defaultProfile = "local"

[profiles.local]
provider = "ollama"
baseUrl = "http://localhost:11434"
model = "llava:latest"

[profiles.spark-ising]
provider = "vllm"
baseUrl = "http://localhost:18000/v1"
model = "nvidia/Ising-Calibration-1-35B-A3B"
# Prefer environment indirection for secrets instead of writing API keys here.
apiKeyEnv = "PI_QCAL_VLLM_API_KEY"
# Some vLLM deployments have issues with OpenAI response_format JSON mode.
responseFormatJson = false

[profiles.nvidia]
provider = "nvidia"
baseUrl = "https://integrate.api.nvidia.com/v1"
model = "nvidia/ising-calibration-1-35b-a3b"
apiKeyEnv = "NVIDIA_API_KEY"
temperature = 0.2
maxTokens = 32768
enableThinking = false

[profiles.openai]
provider = "openai-compatible"
baseUrl = "https://api.openai.com/v1"
model = "gpt-4o-mini"
apiKeyEnv = "OPENAI_API_KEY"
